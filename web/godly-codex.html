<title>Godly Base Codex</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Spectral:wght@300;400;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#EEF0EA; --leaf:#F7F8F4; --sunk:#E4E8DF;
  --ink:#16211C; --ink-2:#55655C; --ink-3:#7E8C84;
  --rule:#CBD2C8; --rule-soft:#DDE2D8;
  --binding:#123026; --binding-2:#0C221A;
  --gilt:#9A7218; --gilt-bright:#C79A2A;
  --ser-1:#3A62A8; --ser-2:#C79A2A; --ser-3:#0F9280;
  --good:#2F7A55; --warn:#B4661A; --crit:#A33327; --idle:#7E8C84;
  --gutter-shadow:rgba(18,48,38,.14);
  --sel:rgba(58,98,168,.12);
  --shadow:0 1px 0 rgba(18,48,38,.05), 0 12px 30px -22px rgba(18,48,38,.5);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101512; --leaf:#161C18; --sunk:#0B100D;
    --ink:#E3E8E0; --ink-2:#9AA79E; --ink-3:#74827A;
    --rule:#28322C; --rule-soft:#1E2721;
    --binding:#0A1712; --binding-2:#060F0B;
    --gilt:#D8AE55; --gilt-bright:#E8C777;
    --ser-1:#6690DE; --ser-2:#B08820; --ser-3:#189E8B;
    --good:#4EA277; --warn:#C98A33; --crit:#D5675A; --idle:#74827A;
    --gutter-shadow:rgba(0,0,0,.55);
    --sel:rgba(102,144,222,.16);
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 14px 34px -24px #000;
  }
}
:root[data-theme="dark"]{
  --paper:#101512; --leaf:#161C18; --sunk:#0B100D;
  --ink:#E3E8E0; --ink-2:#9AA79E; --ink-3:#74827A;
  --rule:#28322C; --rule-soft:#1E2721;
  --binding:#0A1712; --binding-2:#060F0B;
  --gilt:#D8AE55; --gilt-bright:#E8C777;
  --ser-1:#6690DE; --ser-2:#B08820; --ser-3:#189E8B;
  --good:#4EA277; --warn:#C98A33; --crit:#D5675A; --idle:#74827A;
  --gutter-shadow:rgba(0,0,0,.55);
  --sel:rgba(102,144,222,.16);
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 14px 34px -24px #000;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--sunk); color:var(--ink);
  font-family:Spectral,Georgia,'Times New Roman',serif; font-weight:400;
  font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font:inherit;color:inherit}
::selection{background:var(--sel)}
:is(a,button,input,select,[tabindex]):focus-visible{
  outline:2px solid var(--gilt); outline-offset:2px; border-radius:2px;
}

/* ---------- the bound object ---------- */
.codex{display:grid; grid-template-columns:220px minmax(0,1fr); min-height:100vh}
.spine{
  background:linear-gradient(100deg,var(--binding-2),var(--binding) 55%,var(--binding-2));
  color:#DCE6DE; border-right:1px solid var(--binding-2);
  display:flex; flex-direction:column; gap:22px; padding:22px 0 18px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.spine::after{content:"";position:absolute;top:0;right:0;width:14px;height:100%;
  background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0));pointer-events:none}
.stamp{padding:0 20px; display:flex; flex-direction:column; gap:3px}
.stamp .mark{
  font-family:Fraunces,Georgia,serif; font-variation-settings:'opsz' 96; font-weight:700;
  font-size:24px; line-height:1.05; color:var(--gilt-bright); letter-spacing:.005em;
}
.stamp .sub{
  font-family:'JetBrains Mono',ui-monospace,monospace; font-size:9px; letter-spacing:.16em;
  text-transform:uppercase; color:#8FA79A; white-space:nowrap;
}
.rule-gilt{height:1px;background:linear-gradient(90deg,transparent,var(--gilt),transparent);margin:0 16px;opacity:.6}
.tabs{display:flex;flex-direction:column;gap:1px;padding:0 10px}
.tab{
  display:grid; grid-template-columns:26px 1fr; align-items:baseline; gap:8px;
  background:none;border:0;text-align:left;cursor:pointer;
  padding:8px 10px; border-radius:3px; color:#C6D3CA;
}
.tab .num{font-family:'JetBrains Mono',monospace;font-size:10px;color:#7E9A8B;letter-spacing:.06em}
.tab .name{font-family:Fraunces,Georgia,serif;font-variation-settings:'opsz' 24;font-size:14.5px;line-height:1.25}
.tab:hover{background:rgba(255,255,255,.05);color:#EAF2EC}
.tab[aria-current="true"]{background:rgba(199,154,42,.14);color:#F2E7CC}
.tab[aria-current="true"] .num{color:var(--gilt-bright)}
.spine-foot{margin-top:auto;padding:0 20px;display:flex;flex-direction:column;gap:10px}
.pulse{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;color:#8FA79A;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(47,122,85,.22)}
.ghost-btn{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#DCE6DE;
  border-radius:3px;padding:7px 10px;cursor:pointer;
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
}
.ghost-btn:hover{background:rgba(255,255,255,.12)}

/* ---------- book body ---------- */
.book{display:flex;flex-direction:column;min-width:0;background:var(--sunk)}
.running-head{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 30px 10px; border-bottom:1px solid var(--rule-soft); background:var(--paper);
}
.running-head .rh-left{display:flex;align-items:baseline;gap:12px;min-width:0}
.rh-chapter{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.rh-title{font-family:Fraunces,Georgia,serif;font-variation-settings:'opsz' 48;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rh-tools{display:flex;align-items:center;gap:8px;flex:none}
.tool{
  background:transparent;border:1px solid var(--rule);border-radius:3px;padding:6px 9px;cursor:pointer;
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);
}
.tool:hover{border-color:var(--gilt);color:var(--ink)}

.spread{
  flex:1; display:grid; grid-template-columns:minmax(0,0.85fr) minmax(0,1.15fr);
  background:var(--paper); position:relative;
}
.spread::before{
  content:"";position:absolute;inset-block:0;left:calc(0.425 * 100%);width:34px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,var(--gutter-shadow),transparent);pointer-events:none;z-index:2;
}
.page{padding:34px 34px 46px;min-width:0}
.page.verso{border-right:1px solid var(--rule-soft)}
.page.recto{background:var(--leaf)}
.turning{animation:leaf .34s ease}
@keyframes leaf{
  from{opacity:0;transform:translateX(10px) rotateY(-2.5deg)}
  to{opacity:1;transform:none}
}
@media (prefers-reduced-motion:reduce){.turning{animation:none}*{scroll-behavior:auto}}

.folio{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:10px 30px;border-top:1px solid var(--rule-soft);background:var(--paper);
  font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase;
}
.folio-nav{display:flex;gap:6px}

/* ---------- typography inside pages ---------- */
h2.leaf-title{
  font-family:Fraunces,Georgia,serif;font-variation-settings:'opsz' 144;font-weight:700;
  font-size:clamp(28px,3.2vw,40px);line-height:1.03;margin:0 0 6px;text-wrap:balance;letter-spacing:-.012em;
}
h3.sec{
  font-family:Fraunces,Georgia,serif;font-variation-settings:'opsz' 36;font-weight:600;
  font-size:17px;margin:0 0 8px;text-wrap:balance;
}
.eyebrow{
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gilt);margin:0 0 10px;
}
.lede{font-size:16.5px;line-height:1.66;color:var(--ink);max-width:62ch;margin:0 0 14px}
.lede::first-letter{}
.body-col p{max-width:64ch;margin:0 0 12px;color:var(--ink-2)}
.drop::first-letter{
  float:left;font-family:Fraunces,Georgia,serif;font-variation-settings:'opsz' 144;font-weight:700;
  font-size:56px;line-height:.82;padding:6px 10px 0 0;color:var(--gilt);
}
.marginalia{
  border-left:2px solid var(--gilt);padding:2px 0 2px 14px;margin:16px 0;
  font-size:14px;color:var(--ink-2);font-style:italic;max-width:56ch;
}
.stack{display:flex;flex-direction:column;gap:18px}
.stack-sm{display:flex;flex-direction:column;gap:9px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.label{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.hr{height:1px;background:var(--rule-soft);border:0;margin:0}
</style>
<style>
/* ---------- components ---------- */
.card{
  background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:14px 15px;
  box-shadow:var(--shadow);
}
.page.recto .card{background:var(--paper)}
.card.flat{box-shadow:none}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.vital{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border:1px solid var(--rule);border-radius:4px;background:var(--paper)}
.vital .n{font-family:Fraunces,Georgia,serif;font-variation-settings:'opsz' 96;font-weight:700;font-size:27px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.vital .d{font-size:12.5px;color:var(--ink-3)}
.pill{
  display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:2px 9px;
  font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid currentColor;
}
.pill .bead{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)}
.pill.crit{color:var(--crit)} .pill.idle{color:var(--idle)}
.pill.info{color:var(--ser-1)}
.tag{
  display:inline-block;border:1px solid var(--rule);border-radius:3px;padding:1px 7px;
  font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;color:var(--ink-2);text-transform:uppercase;
}

/* org chart */
.org-tier{display:flex;flex-direction:column;gap:8px}
.chief{
  display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;
  width:100%;text-align:left;background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--gilt);
  border-radius:4px;padding:10px 12px;cursor:pointer;
}
.chief:hover{border-color:var(--gilt)}
.chief[aria-expanded="true"]{background:var(--leaf);border-color:var(--gilt)}
.sigil{
  width:44px;height:44px;border-radius:3px;display:grid;place-items:center;
  background:var(--binding);color:var(--gilt-bright);
  font-family:Fraunces,Georgia,serif;font-variation-settings:'opsz' 24;font-weight:700;font-size:13px;letter-spacing:.02em;
}
.chief .who{display:flex;flex-direction:column;gap:1px;min-width:0}
.chief .who b{font-family:Fraunces,Georgia,serif;font-variation-settings:'opsz' 36;font-weight:600;font-size:15px}
.chief .who span{font-size:12.5px;color:var(--ink-3)}
.crew{display:none;padding:8px 0 4px 26px;border-left:1px dashed var(--rule);margin-left:20px;gap:6px;flex-direction:column}
.crew.open{display:flex}
.unit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;
  border:1px solid var(--rule-soft);border-radius:3px;padding:8px 10px;background:var(--leaf)}
.unit .nm{font-size:13.5px}
.unit .nm b{font-weight:600}
.unit .nm em{font-style:normal;color:var(--ink-3);font-size:12.5px}
.pair-note{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;color:var(--gilt);text-transform:uppercase}

/* pipeline */
.pipe{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(168px,1fr);gap:8px;overflow-x:auto;padding-bottom:6px}
.stage{border:1px solid var(--rule);border-radius:4px;background:var(--paper);display:flex;flex-direction:column;min-height:150px}
.stage-head{padding:8px 10px;border-bottom:1px solid var(--rule-soft);display:flex;flex-direction:column;gap:2px}
.stage-head .t{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.stage-head .v{font-family:Fraunces,Georgia,serif;font-variation-settings:'opsz' 36;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.stage-body{display:flex;flex-direction:column;gap:6px;padding:8px}
.deal{
  text-align:left;background:var(--leaf);border:1px solid var(--rule-soft);border-radius:3px;
  padding:7px 9px;cursor:pointer;display:flex;flex-direction:column;gap:3px;
}
.deal:hover,.deal[aria-pressed="true"]{border-color:var(--gilt);background:var(--paper)}
.deal .co{font-size:13.5px;font-weight:600;line-height:1.25}
.deal .mt{display:flex;justify-content:space-between;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* charts */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.axis-line{stroke:var(--rule);stroke-width:1}
.grid-line{stroke:var(--rule-soft);stroke-width:1}
.bar{transition:opacity .12s}
.chart:hover .bar{opacity:.55}
.chart .bar:hover{opacity:1}
.tick{fill:var(--ink-3);font-size:9.5px;letter-spacing:.08em}
.val{fill:var(--ink);font-size:10.5px;font-weight:500}
.spark-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.spark-cell{border:1px solid var(--rule-soft);border-radius:3px;padding:8px 10px;background:var(--paper)}
.spark-cell .hd{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:4px}
.spark-cell .hd b{font-size:13px;font-weight:600}
.spark-cell .hd span{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:2px}
.fstep{display:grid;grid-template-columns:132px minmax(0,1fr) 96px;gap:10px;align-items:center}
.fstep .fn{font-size:13px}
.fbar{height:26px;border-radius:0 3px 3px 0;position:relative}
.fstep .fv{font-family:'JetBrains Mono',monospace;font-size:11px;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.fstep .drop-rate{color:var(--ink-3);font-size:10px}

/* tables / vault */
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:4px;background:var(--paper)}
table.grid{border-collapse:collapse;width:100%;font-size:13px}
table.grid th{
  position:sticky;top:0;background:var(--paper);text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);
  font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  cursor:pointer;white-space:nowrap;
}
table.grid th:hover{color:var(--ink)}
table.grid th .sortmark{color:var(--gilt)}
table.grid td{padding:7px 10px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
table.grid tbody tr:hover{background:var(--sel)}
table.grid tbody tr.on{background:var(--sel)}
table.grid.dense td,table.grid.dense th{white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.scroll-hint{display:block;text-align:right;margin-top:-2px}
table.grid td.num{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.vault-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select.ctl,input.ctl{
  font:inherit;font-size:13px;background:var(--paper);color:var(--ink);
  border:1px solid var(--rule);border-radius:3px;padding:6px 9px;
}
input.ctl{font-family:'JetBrains Mono',monospace;font-size:12px;min-width:170px}
.extract{background:var(--sunk);border:1px solid var(--rule);border-radius:4px;padding:10px 12px}
pre.dump{
  margin:8px 0 0;max-height:210px;overflow:auto;background:var(--paper);border:1px solid var(--rule-soft);
  border-radius:3px;padding:10px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.55;white-space:pre;
}
/* links / appendix */
.entry{display:grid;gap:3px;padding:10px 0;border-bottom:1px solid var(--rule-soft)}
.entry:last-child{border-bottom:0}
.entry .top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.entry a{font-family:Fraunces,Georgia,serif;font-variation-settings:'opsz' 24;font-weight:600;font-size:14.5px;
  color:var(--ink);text-decoration:none;border-bottom:1px solid var(--gilt)}
.entry a:hover{color:var(--gilt)}
.entry p{margin:0;font-size:13px;color:var(--ink-2);max-width:70ch}
.entry .meta{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.entry .urlmeta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-3);text-transform:none;letter-spacing:0;word-break:break-all}
/* key ledger */
.keyrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule-soft)}
.keyrow:last-child{border-bottom:0}
.keyrow .kn{display:flex;flex-direction:column;gap:1px;min-width:0}
.keyrow .kn b{font-size:13.5px;font-weight:600}
.keyrow .kn code{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-3)}
.meter{width:96px;height:6px;border-radius:100px;background:var(--rule-soft);overflow:hidden}
.meter i{display:block;height:100%;border-radius:100px;background:var(--ser-3)}
.meter i.low{background:var(--warn)} .meter i.out{background:var(--crit)}
/* growth / unwritten */
.unwritten{border:1px dashed var(--rule);border-radius:4px;padding:16px;color:var(--ink-3);text-align:center;font-style:italic}
/* tooltip */
#tip{
  position:fixed;z-index:60;pointer-events:none;opacity:0;transform:translate(-50%,-115%);
  background:var(--binding);color:#EAF2EC;border:1px solid var(--gilt);border-radius:3px;
  padding:6px 9px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.45;white-space:nowrap;
  transition:opacity .1s;box-shadow:0 10px 24px -16px #000;
}
#tip.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:1080px){
  .codex{grid-template-columns:1fr}
  .spine{position:static;height:auto;flex-direction:column}
  .tabs{flex-direction:row;flex-wrap:wrap}
  .tab{grid-template-columns:auto 1fr}
  .spread{grid-template-columns:1fr}
  .spread::before{display:none}
  .page.verso{border-right:0;border-bottom:1px solid var(--rule-soft)}
}
</style>
<div class="codex">
  <aside class="spine">
    <div class="stamp">
      <div class="mark">Godly<br>Base</div>
      <div class="sub">Operating Codex &middot; vol. I</div>
    </div>
    <div class="rule-gilt"></div>
    <nav class="tabs" id="tabs" aria-label="Chapters"></nav>
    <div class="spine-foot">
      <div class="rule-gilt" style="margin:0"></div>
      <div class="pulse"><span class="dot"></span><span id="serverPulse">Local cloud &middot; online</span></div>
      <button class="ghost-btn" id="themeBtn" type="button">Night reading</button>
    </div>
  </aside>

  <main class="book">
    <header class="running-head">
      <div class="rh-left">
        <span class="rh-chapter mono" id="rhChapter">Frontispiece</span>
        <span class="rh-title" id="rhTitle">The Standing Order</span>
      </div>
      <div class="rh-tools">
        <button class="tool" id="jumpVault" type="button">Open the Vault</button>
      </div>
    </header>

    <div class="spread" id="spread">
      <section class="page verso" id="verso" aria-live="polite"></section>
      <section class="page recto" id="recto"></section>
    </div>

    <footer class="folio">
      <span id="folioLeft">Godly Base &middot; Operating Codex</span>
      <span class="folio-nav">
        <button class="tool" id="prevBtn" type="button">&larr; Previous leaf</button>
        <button class="tool" id="nextBtn" type="button">Next leaf &rarr;</button>
      </span>
      <span id="folioRight" class="mono">Leaf 1 / 9</span>
    </footer>

<script>
/* ============================ helpers ============================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const usd = n => "$" + Number(n).toLocaleString("en-US");
const usdK = n => n >= 1000 ? "$" + (n/1000).toFixed(n % 1000 ? 1 : 0) + "k" : "$" + n;
const pct = n => (n*100).toFixed(n < 0.1 ? 1 : 0) + "%";
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);

/* tooltip, delegated */
const tip = $("#tip");
document.addEventListener("mouseover", e => {
  const t = e.target.closest("[data-tip]"); if (!t) return;
  tip.innerHTML = t.getAttribute("data-tip").replace(/\|/g, "<br>"); tip.classList.add("on");
});
document.addEventListener("mousemove", e => {
  if (!tip.classList.contains("on")) return;
  tip.style.left = e.clientX + "px"; tip.style.top = e.clientY - 8 + "px";
});
document.addEventListener("mouseout", e => {
  if (e.target.closest("[data-tip]")) tip.classList.remove("on");
});

/* --- charts --- */
/* magnitude, one series → single sequential hue, direct-labelled */
function barChart(rows, opt={}){
  const w = 560, rowH = 30, padL = 128, padR = 74, h = rows.length * rowH + 22;
  const max = Math.max(...rows.map(r => r.value)) || 1;
  const scale = v => (v / max) * (w - padL - padR);
  const ticks = [0, .5, 1].map(f => padL + f * (w - padL - padR));
  let g = ticks.map(x => `<line class="grid-line" x1="${x}" y1="6" x2="${x}" y2="${h-16}"/>`).join("");
  g += rows.map((r,i) => {
    const y = 10 + i*rowH, bw = Math.max(scale(r.value), 2);
    return `<g class="bar" data-tip="${esc(r.label)}|${esc(opt.fmt ? opt.fmt(r.value) : r.value)}${r.sub ? "|"+esc(r.sub) : ""}">
      <rect x="${padL}" y="${y}" width="${bw}" height="16" rx="4" fill="${r.color || "var(--ser-3)"}"/>
      <text class="tick" x="${padL-10}" y="${y+12}" text-anchor="end">${esc(r.label)}</text>
      <text class="val" x="${padL+bw+8}" y="${y+12}">${esc(opt.fmt ? opt.fmt(r.value) : r.value)}</text>
    </g>`;
  }).join("");
  g += `<line class="axis-line" x1="${padL}" y1="6" x2="${padL}" y2="${h-16}"/>`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(opt.aria||"bar chart")}">${g}</svg>`;
}

function sparkline(series, label, unit){
  const w = 150, h = 34, max = Math.max(...series), min = Math.min(...series);
  const x = i => (i/(series.length-1))*(w-4)+2;
  const y = v => h-3 - ((v-min)/((max-min)||1))*(h-9);
  const pts = series.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const area = `M2,${h-1} L${pts.split(" ").join(" L")} L${w-2},${h-1} Z`;
  const last = series[series.length-1];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}: ${series.join(", ")} ${esc(unit||"")}">
    <path d="${area}" fill="var(--ser-3)" opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="var(--ser-3)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(series.length-1)}" cy="${y(last)}" r="3.2" fill="var(--ser-3)" stroke="var(--paper)" stroke-width="2"/>
  </svg>`;
}

function funnelChart(steps){
  const top = steps[0].count;
  return `<div class="funnel">` + steps.map((s,i) => {
    const wpct = Math.max((s.count/top)*100, 3);
    const shade = 12 + i*11;
    const conv = i ? (s.count/steps[i-1].count) : 1;
    return `<div class="fstep">
      <div class="fn">${esc(s.stage)}</div>
      <div class="fbar" style="width:${wpct}%;background:color-mix(in oklab, var(--ser-3), var(--ink) ${shade}%)"
           data-tip="${esc(s.stage)}|${s.count.toLocaleString()} ${i?"· "+pct(conv)+" of prior":""}|${esc(s.note)}"></div>
      <div class="fv">${s.count.toLocaleString()}${i?`<br><span class="drop-rate">${pct(conv)} through</span>`:""}</div>
    </div>`;
  }).join("") + `</div>`;
}

/* --- shared blocks --- */
const vital = (n,d) => `<div class="vital"><span class="n">${esc(n)}</span><span class="d">${esc(d)}</span></div>`;
const pill = (cls,txt) => `<span class="pill ${cls}"><span class="bead"></span>${esc(txt)}</span>`;
const statusPill = s => ({
  live:["good","live"], ok:["good","ok"], running:["good","running"], Signed:["good","signed"],
  hot:["good","hot"], active:["info","active"], pending:["warn","pending"], warn:["warn","attention"],
  paused:["warn","paused"], review:["warn","in review"], manual:["warn","manual"], restricted:["crit","restricted"],
  idle:["idle","idle"]
}[s] || ["idle", s]);

function vaultRows(){
  const t = TABLES[state.table]; let rows = t.rows().slice();
  if (state.q){
    const q = state.q.toLowerCase();
    rows = rows.filter(r => Object.values(r).some(v => String(v).toLowerCase().includes(q)));
  }
  if (state.sort.col){
    const c = state.sort.col, dir = state.sort.dir;
    rows.sort((a,b) => {
      const x = a[c], y = b[c];
      if (typeof x === "number" && typeof y === "number") return (x-y)*dir;
      return String(x).localeCompare(String(y))*dir;
    });
  }
  return rows;
}
function toCSV(rows){
  if (!rows.length) return "";
  const cols = Object.keys(rows[0]);
  const cell = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  return [cols.join(","), ...rows.map(r => cols.map(c => cell(r[c])).join(","))].join("\n");
}

function vaultCh(){
  const t = TABLES[state.table], rows = vaultRows();

  const recto = `

        <thead><tr>${cols.map(c => `<th data-col="${esc(c)}">${esc(c)}${state.sort.col===c?`<span class="sortmark"> ${state.sort.dir>0?"▲":"▼"}</span>`:""}</th>`).join("")}</tr></thead>

<script>
/* ============================ binding it together ============================ */
const LEAVES = [
  {num:"—",    chapter:"Frontispiece",  title:"An operating system bound as a book", tab:"Frontispiece", render:frontispiece},
  {num:"I",    chapter:"Chapter I",     title:"The House",             tab:"The House",           render:house},
  {num:"II",   chapter:"Chapter II",    title:"Book of Accounts",      tab:"Book of Accounts",    render:accountsCh},
  {num:"III",  chapter:"Chapter III",   title:"Book of Signals",       tab:"Book of Signals",     render:signalsCh},
  {num:"IV",   chapter:"Chapter IV",    title:"Book of Alliances",     tab:"Book of Alliances",   render:alliancesCh},
  {num:"V",    chapter:"Chapter V",     title:"The Vault",             tab:"The Vault",           render:vaultCh},
  {num:"VI",   chapter:"Chapter VI",    title:"The Nerve",             tab:"The Nerve",           render:nerveCh},
  {num:"VII",  chapter:"Chapter VII",   title:"The Appendix",          tab:"The Appendix",        render:appendixCh},
  {num:"VIII", chapter:"Chapter VIII",  title:"The Brain",             tab:"The Brain",           render:brainCh}
];

function drawTabs(){
  $("#tabs").innerHTML = LEAVES.map((l,i) => `
    <button class="tab" type="button" data-leaf="${i}" aria-current="${i===state.leaf}">
      <span class="num">${esc(l.num)}</span><span class="name">${esc(l.tab)}</span>
    </button>`).join("");
}

function render(turn){
  const l = LEAVES[state.leaf], out = l.render();
  const v = $("#verso"), r = $("#recto");
  v.innerHTML = out.verso; r.innerHTML = out.recto;
  $("#rhChapter").textContent = l.chapter;
  $("#rhTitle").textContent = l.title;
  $("#folioRight").textContent = `Leaf ${state.leaf+1} / ${LEAVES.length}`;
  $("#folioLeft").textContent = l.num === "—" ? "Godly Base · Operating Codex" : `Godly Base · ${l.chapter} · ${l.title}`;
  $("#prevBtn").disabled = state.leaf === 0;
  $("#nextBtn").disabled = state.leaf === LEAVES.length - 1;
  drawTabs();
  if (turn){ [v,r].forEach(p => { p.classList.remove("turning"); void p.offsetWidth; p.classList.add("turning"); }); }
  document.querySelectorAll(".spread")[0].scrollTop = 0;
}

function goTo(i, keepScroll){
  state.leaf = Math.max(0, Math.min(LEAVES.length-1, i));
  render(true);
  if (!keepScroll) window.scrollTo({top:0, behavior:"instant"});
}

/* --- events --- */
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-leaf]"); if (!b) return;
  goTo(+b.dataset.leaf);
});
$("#prevBtn").addEventListener("click", () => goTo(state.leaf-1));
$("#nextBtn").addEventListener("click", () => goTo(state.leaf+1));
$("#jumpVault").addEventListener("click", () => goTo(LEAVES.findIndex(l => l.title === "The Vault")));

document.addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea")) return;
  if (e.key === "ArrowRight") goTo(state.leaf+1);
  if (e.key === "ArrowLeft") goTo(state.leaf-1);
});

$("#spread").addEventListener("click", e => {
  const deal = e.target.closest("[data-deal]");
  if (deal){ state.deal = deal.dataset.deal; render(false); return; }

  const chief = e.target.closest("[data-chief]");
  if (chief){ const i = +chief.dataset.chief; state.chief = state.chief === i ? null : i; render(false); return; }

  const col = e.target.closest("th[data-col]");
  if (col){
    const c = col.dataset.col;
    state.sort = state.sort.col === c ? {col:c, dir:-state.sort.dir} : {col:c, dir:1};
    render(false); return;
  }

  const fmt = e.target.closest("[data-fmt]");
  if (fmt){ state.fmt = fmt.dataset.fmt; render(false); return; }

  if (e.target.closest("#copyBtn")){
    const btn = e.target.closest("#copyBtn");
    navigator.clipboard.writeText($("#dump").textContent).then(
      () => { btn.textContent = "Copied"; setTimeout(() => { btn.textContent = "Copy"; }, 1600); },
      () => {
        const range = document.createRange(); range.selectNodeContents($("#dump"));
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
        btn.textContent = "Selected — press ⌘C"; setTimeout(() => { btn.textContent = "Copy"; }, 2600);
      }
    );
  }
});

$("#spread").addEventListener("change", e => {
  if (e.target.id === "tableSel"){
    state.table = e.target.value; state.sort = {col:null,dir:1}; state.q = "";
    render(false); $("#tableSel")?.focus();
  }
});

$("#spread").addEventListener("input", e => {
  if (e.target.id === "qBox"){
    state.q = e.target.value; render(false);
    const box = $("#qBox");
    if (box){ box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
  }
});

/* --- theme --- */
const themeBtn = $("#themeBtn");
function readTheme(){ try { return localStorage.getItem("codex-theme"); } catch { return null; } }
function applyTheme(t){
  if (t) document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  const dark = t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches);
  themeBtn.textContent = dark ? "Day reading" : "Night reading";
}
themeBtn.addEventListener("click", () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark"
    || (!document.documentElement.hasAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  const next = dark ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("codex-theme", next); } catch {}
});
applyTheme(readTheme());

render(false);
</script>
