<style>
/* ============================================================
   shell
   ============================================================ */
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg-app); color:var(--fg-primary);
  font-family:var(--font-ui); font-size:var(--text-md); line-height:1.5;
  -webkit-font-smoothing:antialiased; touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
a{color:inherit}
button{font:inherit;color:inherit}
:is(a,button,input,select,summary,[tabindex]):focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--radius-sm);
}
:where(button,a,input,select){transition:background-color var(--dur-fast) var(--ease),
  border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease)}
::selection{background:var(--bg-selected)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{
  position:absolute;left:-9999px;top:var(--space-2);z-index:90;background:var(--bg-raised);
  color:var(--fg-primary);border:1px solid var(--accent);border-radius:var(--radius-sm);
  padding:var(--space-2) var(--space-3);font-family:var(--font-mono);font-size:var(--text-xs);
  text-decoration:none;letter-spacing:.08em;text-transform:uppercase;
}
.skip:focus{left:var(--space-2)}

.os{display:grid;grid-template-columns:var(--rail-width) minmax(0,1fr);min-height:100vh}

/* ---- rail ---- */
.rail{
  background:var(--bg-chrome);border-right:1px solid var(--bg-chrome-deep);
  color:var(--fg-on-chrome);display:flex;flex-direction:column;gap:var(--space-5);
  padding:var(--space-5) 0 var(--space-4);position:sticky;top:0;height:100vh;overflow-y:auto;
  padding-left:env(safe-area-inset-left);
}
.brandmark{display:flex;flex-direction:column;gap:2px;padding:0 var(--space-5)}
.brandmark .name{
  font-family:var(--font-display);font-weight:700;font-size:var(--text-xl);line-height:1.05;
  color:var(--accent-bright);letter-spacing:.005em;
}
.brandmark .kind{
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--fg-on-chrome-muted);
}
.navgroup{display:flex;flex-direction:column;gap:1px;padding:0 var(--space-2)}
.navgroup h2{
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--fg-on-chrome-muted);margin:0 0 var(--space-2);padding:0 var(--space-3);font-weight:500;
}
.navitem{
  display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:var(--space-3);
  padding:7px var(--space-3);border-radius:var(--radius-sm);color:var(--nav-item-fg);
  text-decoration:none;font-size:13.5px;min-height:34px;
}
.navitem:hover{background:rgba(255,255,255,.06);color:#EAF2EC}
.navitem[aria-current="page"]{background:var(--nav-item-bg-active);color:var(--nav-item-fg-active);font-weight:500}
.navitem .glyph{opacity:.85;display:grid;place-items:center}
.navitem .count{
  font-family:var(--font-mono);font-size:10.5px;color:var(--fg-on-chrome-muted);
  font-variant-numeric:tabular-nums;
}
.navitem[aria-current="page"] .count{color:var(--accent-bright)}
.rail-foot{margin-top:auto;padding:0 var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)}
.hr-chrome{height:1px;background:rgba(255,255,255,.12);border:0;margin:0}
.uptime{display:flex;align-items:center;gap:var(--space-2);font-family:var(--font-mono);
  font-size:10px;letter-spacing:.1em;color:var(--fg-on-chrome-muted);text-transform:uppercase}
.led{width:7px;height:7px;border-radius:50%;background:var(--status-good);
  box-shadow:0 0 0 3px color-mix(in oklab, var(--status-good), transparent 78%)}

/* ---- workspace ---- */
.workspace{display:flex;flex-direction:column;min-width:0;background:var(--bg-app)}
.topbar{
  display:flex;align-items:center;gap:var(--space-4);height:var(--topbar-height);
  padding:0 var(--space-6);border-bottom:1px solid var(--border-soft);background:var(--bg-surface);
  position:sticky;top:0;z-index:20;
}
.crumb{display:flex;align-items:baseline;gap:var(--space-3);min-width:0;flex:1}
.crumb .scope{font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg-muted)}
.crumb h1{
  font-family:var(--font-display);font-weight:700;font-size:var(--text-lg);margin:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-wrap:balance;
}
.btn{
  background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:6px var(--space-3);cursor:pointer;font-family:var(--font-mono);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--fg-secondary);min-height:32px;
  display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--accent);color:var(--fg-primary);background:var(--bg-hover)}
.btn kbd{font-family:var(--font-mono);font-size:9.5px;border:1px solid var(--border);
  border-radius:2px;padding:0 3px;color:var(--fg-muted)}

main{padding:var(--space-6);min-width:0;flex:1}
.module{display:flex;flex-direction:column;gap:var(--space-6);max-width:1440px}
.enter{animation:rise var(--dur-base) var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .enter{animation:none}
  *{scroll-behavior:auto}
}

/* ---- headings & prose ---- */
h2.sec{font-family:var(--font-display);font-weight:700;font-size:var(--text-lg);margin:0;text-wrap:balance}
h3.sub{font-family:var(--font-ui);font-weight:600;font-size:var(--text-md);margin:0 0 var(--space-2)}
.eyebrow{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--fg-muted);margin:0}
.lede{font-size:15px;line-height:1.6;color:var(--fg-secondary);max-width:76ch;margin:0}
.note{font-size:var(--text-sm);color:var(--fg-muted);margin:0;max-width:80ch}
.label{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}
.stack{display:flex;flex-direction:column;gap:var(--space-3);min-width:0}
.cols{display:grid;gap:var(--space-4);grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.cols-3{display:grid;gap:var(--space-3);grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.split{display:grid;gap:var(--space-6);grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:start}
@media (max-width:1080px){.split{grid-template-columns:1fr}}
</style>
<style>
/* ============================================================
   components
   ============================================================ */
.panel{
  background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:var(--radius-md);
  box-shadow:var(--shadow-panel);min-width:0;
}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
  padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--border-soft);
}
.panel-body{padding:var(--space-4)}
.panel-body.flush{padding:0}

.stat{display:flex;flex-direction:column;gap:2px;padding:var(--space-3) var(--space-4);
  border:1px solid var(--border);border-radius:var(--radius-md);background:var(--panel-bg);min-width:0}
.stat .value{font-family:var(--font-display);font-weight:700;font-size:var(--text-2xl);line-height:1.05;
  font-variant-numeric:tabular-nums;letter-spacing:-.015em}
.stat .caption{font-size:var(--text-sm);color:var(--fg-muted);min-width:0}
.stat .delta{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-muted)}

.tag{display:inline-block;border:1px solid var(--border);border-radius:var(--radius-sm);padding:1px 7px;
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;color:var(--fg-secondary);text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:2px 9px;
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor}
.pill .bead{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{color:var(--status-good)} .pill.info{color:var(--status-info)}
.pill.warn{color:var(--status-warn)} .pill.crit{color:var(--status-critical)}
.pill.idle{color:var(--status-idle)}

/* tables */
.tablewrap{overflow-x:auto;overscroll-behavior-x:contain}
table.grid{border-collapse:collapse;width:100%;font-size:13.5px}
table.grid caption{text-align:left}
table.grid th{
  position:sticky;top:0;z-index:1;background:var(--table-header-bg);text-align:left;
  padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--border);white-space:nowrap;
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-muted);font-weight:500;
}
table.grid th[aria-sort]{color:var(--fg-primary)}
table.grid th button.sortbtn{
  all:unset;display:inline-flex;align-items:center;gap:5px;cursor:pointer;min-height:26px;
  font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;
}
table.grid th button.sortbtn:hover{color:var(--fg-primary)}
table.grid th button.sortbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
table.grid td{padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--border-soft);vertical-align:top}
table.grid tbody tr:hover{background:var(--bg-hover)}
table.grid td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table.grid.dense td,table.grid.dense th{white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.sortmark{color:var(--accent-ink)}

/* fields */
input.field,select.field{
  font:inherit;font-size:13.5px;background:var(--field-bg);color:var(--fg-primary);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px var(--space-2);min-height:34px;
}
input.field{font-family:var(--font-mono);font-size:12.5px;min-width:200px}
select.field{background-color:var(--field-bg);color:var(--fg-primary)}

/* pipeline board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(180px,1fr);gap:var(--space-2);
  overflow-x:auto;overscroll-behavior-x:contain;padding-bottom:var(--space-2)}
.lane{border:1px solid var(--border);border-radius:var(--radius-md);background:var(--panel-bg);
  display:flex;flex-direction:column;min-height:140px;min-width:0}
.lane-head{padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--border-soft);
  display:flex;flex-direction:column;gap:1px}

.record{

  font-size:10px;color:var(--fg-muted);font-variant-numeric:tabular-nums}

/* org */
.node{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:var(--space-3);align-items:center;
  width:100%;text-align:left;background:var(--panel-bg);border:1px solid var(--border);
  border-left:3px solid var(--accent);border-radius:var(--radius-md);padding:var(--space-2) var(--space-3);cursor:pointer}
.node:hover{border-color:var(--accent)}
.node[aria-expanded="true"]{background:var(--bg-raised)}
.sigil{width:40px;height:40px;border-radius:var(--radius-sm);display:grid;place-items:center;
  background:var(--bg-chrome);color:var(--accent-bright);font-family:var(--font-mono);
  font-weight:600;font-size:11px;letter-spacing:.04em}
.node .who{display:flex;flex-direction:column;gap:1px;min-width:0}
.node .who b{font-size:14px;font-weight:600}
.node .who span{font-size:var(--text-sm);color:var(--fg-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crew{display:none;flex-direction:column;gap:6px;padding:var(--space-2) 0 var(--space-2) var(--space-6);
  border-left:1px dashed var(--border);margin-left:var(--space-5)}
.crew.open{display:flex}
.unit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-3);align-items:center;
  border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);background:var(--bg-raised)}
.unit .nm{font-size:13px;min-width:0}
.pairs{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;color:var(--accent-ink);text-transform:uppercase}

/* charts */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.grid-line{stroke:var(--border-soft);stroke-width:1}
.axis-line{stroke:var(--border);stroke-width:1}
.tick{fill:var(--fg-muted);font-size:9.5px;letter-spacing:.06em}
.val{fill:var(--fg-primary);font-size:10.5px;font-weight:500}
.bar{transition:opacity var(--dur-fast) var(--ease)}
.chart:hover .bar{opacity:.5}
.chart .bar:hover{opacity:1}
.sparks{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:var(--space-3)}
.spark{border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);background:var(--panel-bg)}
.spark .hd{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:4px}
.spark .hd b{font-size:13px;font-weight:600}
.spark .hd span{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-secondary);
  font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:3px}
.fstep{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;gap:var(--space-3);align-items:center}
.fstep .fn{font-size:13px;min-width:0}
.fbar{height:24px;border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.fstep .fv{font-family:var(--font-mono);font-size:10.5px;text-align:right;color:var(--fg-secondary);font-variant-numeric:tabular-nums}
.fstep .thru{color:var(--fg-muted);font-size:9.5px}

/* meters, capability chips, misc */

.meter{width:96px;height:6px;border-radius:100px;background:var(--meter-track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:100px;background:var(--series-3)}
.meter i.low{background:var(--status-warn)} .meter i.out{background:var(--status-critical)}
.meterval{font-family:var(--font-mono);font-size:10px;color:var(--fg-muted);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.meterval.hot{color:var(--status-warn)}
.keyrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:var(--space-3);align-items:center;
  padding:var(--space-2) 0;border-bottom:1px solid var(--border-soft)}
.keyrow:last-child{border-bottom:0}
.keyrow .kn{display:flex;flex-direction:column;gap:1px;min-width:0}
.keyrow .kn b{font-size:13.5px;font-weight:600}

span.cap{display:inline-block;border:1px solid var(--border);border-radius:var(--radius-sm);padding:1px 6px;

span.cap.on{border-color:var(--series-3);color:var(--series-3);

/* source entries */
.entry{display:grid;gap:3px;padding:var(--space-3) 0;border-bottom:1px solid var(--border-soft)}
.entry:last-child{border-bottom:0}
.entry .top{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-2)}
.entry a{font-weight:600;font-size:14px;color:var(--fg-primary);text-decoration:none;

<script>
/* ============================================================
   HERO CAPITAL OS — application
   Routing is the URL: #/<module> and, for Data, ?table=&q=&sort=
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf = new Intl.NumberFormat(undefined);
const cf = new Intl.NumberFormat(undefined, {style:"currency", currency:"USD", maximumFractionDigits:0});
const pf = (n, d=0) => new Intl.NumberFormat(undefined, {style:"percent", maximumFractionDigits:d}).format(n);
const df = new Intl.DateTimeFormat(undefined, {year:"numeric", month:"short", day:"numeric"});
const fmtDate = s => { const d = new Date(s + (s.length === 10 ? "T12:00:00" : "")); return isNaN(d) ? s : df.format(d); };
const usdK = n => n >= 1000 ? "$" + nf.format(Math.round(n/100)/10) + "k" : cf.format(n);
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);

const tip = $("#tip");
document.addEventListener("mouseover", e => {
  const t = e.target.closest("[data-tip]"); if (!t) return;
  tip.innerHTML = t.getAttribute("data-tip").replace(/\|/g, "<br>"); tip.classList.add("on");
});
document.addEventListener("mousemove", e => {
  if (!tip.classList.contains("on")) return;
  tip.style.left = e.clientX + "px"; tip.style.top = (e.clientY - 8) + "px";
});
document.addEventListener("mouseout", e => { if (e.target.closest("[data-tip]")) tip.classList.remove("on"); });

/* ---------- shared blocks ---------- */
const stat = (v, caption, delta) => `<div class="stat">
  <span class="value">${esc(v)}</span><span class="caption">${esc(caption)}</span>
  ${delta ? `<span class="delta">${esc(delta)}</span>` : ""}</div>`;
const pill = (cls, txt) => `<span class="pill ${cls}"><span class="bead" aria-hidden="true"></span>${esc(txt)}</span>`;
const statusPill = s => ({
  live:["good","live"], ok:["good","ok"], running:["good","running"], Running:["good","running"],
  Signed:["good","signed"], hot:["good","hot"], active:["info","active"], Onboarding:["info","onboarding"],
  pending:["warn","pending"], warn:["warn","attention"], paused:["warn","paused"], Pilot:["warn","pilot"],
  pilot:["warn","pilot"], review:["warn","in review"], manual:["warn","manual"],
  restricted:["crit","restricted"], idle:["idle","idle"]
}[s] || ["idle", String(s)]);
const panel = (title, body, right="") => `<section class="panel">
  <div class="panel-head"><h2 class="sec">${esc(title)}</h2>${right}</div>
  <div class="panel-body">${body}</div></section>`;
const panelFlush = (title, body, right="") => `<section class="panel">
  <div class="panel-head"><h2 class="sec">${esc(title)}</h2>${right}</div>
  <div class="panel-body flush">${body}</div></section>`;

/* ---------- charts ---------- */
function barChart(rows, opt={}){
  const w = 560, rowH = 30, padL = 130, padR = 76, h = rows.length * rowH + 22;
  const max = Math.max(...rows.map(r => r.value)) || 1;
  const scale = v => (v / max) * (w - padL - padR);
  let g = [0,.5,1].map(f => `<line class="grid-line" x1="${padL + f*(w-padL-padR)}" y1="6" x2="${padL + f*(w-padL-padR)}" y2="${h-16}"/>`).join("");
  g += rows.map((r,i) => {
    const y = 10 + i*rowH, bw = Math.max(scale(r.value), 2);
    return `<g class="bar" data-tip="${esc(r.label)}|${esc(opt.fmt ? opt.fmt(r.value) : nf.format(r.value))}${r.sub ? "|"+esc(r.sub) : ""}">
      <rect x="${padL}" y="${y}" width="${bw}" height="16" rx="4" fill="var(--series-3)"/>
      <text class="tick" x="${padL-10}" y="${y+12}" text-anchor="end">${esc(r.label)}</text>
      <text class="val" x="${padL+bw+8}" y="${y+12}">${esc(opt.fmt ? opt.fmt(r.value) : nf.format(r.value))}</text>
    </g>`;
  }).join("");
  g += `<line class="axis-line" x1="${padL}" y1="6" x2="${padL}" y2="${h-16}"/>`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(opt.aria || "Bar chart")}">${g}</svg>`;
}
function sparkline(series, label){
  const w = 150, h = 34, max = Math.max(...series), min = Math.min(...series);
  const x = i => (i/(series.length-1))*(w-4)+2, y = v => h-3 - ((v-min)/((max-min)||1))*(h-9);
  const pts = series.map((v,i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}: ${series.join(", ")}">
    <path d="M2,${h-1} L${pts.split(" ").join(" L")} L${w-2},${h-1} Z" fill="var(--series-3)" opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="var(--series-3)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(series.length-1)}" cy="${y(series[series.length-1])}" r="3.2" fill="var(--series-3)" stroke="var(--panel-bg)" stroke-width="2"/>
  </svg>`;
}
function funnelChart(steps){
  const top = steps[0].count;
  return `<div class="funnel">` + steps.map((s,i) => {
    const wpct = Math.max((s.count/top)*100, 3), shade = 12 + i*11;
    const conv = i ? s.count/steps[i-1].count : 1;
    return `<div class="fstep">
      <div class="fn">${esc(s.stage)}</div>
      <div class="fbar" style="width:${wpct}%;background:color-mix(in oklab, var(--series-3), var(--fg-primary) ${shade}%)"
        data-tip="${esc(s.stage)}|${nf.format(s.count)}${i ? " · " + pf(conv) + " of prior" : ""}|${esc(s.note)}"></div>
      <div class="fv">${nf.format(s.count)}${i ? `<br><span class="thru">${pf(conv)} through</span>` : ""}</div>
    </div>`;
  }).join("") + `</div>`;
}

function overview(){
  const open = openDeals(), won = DB.deals.filter(d => d.stage === "Closed Won");
  const escalations = DB.agent_runs.filter(r => r.status !== "ok");
  const sparks = Object.entries(DB.throughput).map(([dept, series]) => `

  return `<div class="module enter">

      ${stat(usdK(sum(won, d => d.value)), "Closed won", "trailing quarter")}

        `<span class="label">${escalations.length} of ${DB.agent_runs.length} runs</span>`)}
      ${panel("Agent throughput", `<div class="sparks">${sparks}</div>`, `<span class="label">Last 14 days</span>`)}

    ${panelFlush("Recent activity", `<div class="tablewrap"><table class="grid">
      <caption class="sr">Recent agent runs</caption>
      <thead><tr><th scope="col">Agent</th><th scope="col">Task</th><th scope="col">Rows</th><th scope="col">State</th><th scope="col">Cost</th></tr></thead>
      <tbody>${runs}</tbody></table></div>`)}

}

/* ---------- Front Office (the product) ---------- */
function frontOffice(){

}

/* ---------- Sales ---------- */
function sales(){

        </button>`).join("") || `<span class="label">Empty</span>`}</div></div>`;

  return `<div class="module enter">
    ${panelFlush("Pipeline", `<div class="panel-body"><div class="board">${board}</div></div>`,
      `<span class="label">Select a deal for detail · scrolls sideways</span>`)}
    <div class="split">
      ${panel("Deal detail — " + d.id, `
        <div class="panel-head" style="padding:0 0 var(--space-3);border:0">
          <div style="min-width:0"><b style="font-size:15px">${esc(d.account)}</b><br><span class="label">${esc(d.niche)}</span></div>

        <div class="stack" style="font-size:13.5px">
          <div><span class="label">Contact</span><br>${esc(d.contact)}${con ? ` · ${esc(con.title)} · <span class="mono">${esc(con.email)}</span> ${pill(con.email_status === "verified" ? "good" : con.email_status === "risky" ? "warn" : "idle", con.email_status)}` : ""}</div>

        </div>`)}

      <thead><tr><th scope="col">Account</th><th scope="col">Industry</th><th scope="col">Staff</th><th scope="col">Ownership verified</th><th scope="col">Fit</th></tr></thead>

</script>

    </div>

      <thead><tr><th scope="col">Partner</th><th scope="col">Type</th><th scope="col">Industry</th><th scope="col">Intros/mo</th><th scope="col">Share</th><th scope="col">Owner</th></tr></thead>
      <tbody>${DB.partners.map(p => `<tr><td><b>${esc(p.name)}</b><br><span class="label">${esc(p.note)}</span></td>

}

/* ---------- Organization ---------- */
function organization(){
  const org = DB.org.chiefs.map((c,i) => `
    <div>
      <button class="node" type="button" data-chief="${i}" aria-expanded="${ui.chief === i}">
        <span class="sigil" translate="no">${esc(c.code)}</span>
        <span class="who"><b>${esc(c.title)} · ${esc(c.agentName)}</b><span>${esc(c.charter)}</span></span>

        <div class="unit" style="border-color:var(--accent)">

          <span class="label">Supervisor</span>
        </div>
        ${c.units.map(u => `<div class="unit">
          <span class="nm"><b>${esc(u.name)}</b> <span class="mono" translate="no" style="color:var(--fg-muted);font-size:11px">${esc(u.id)}</span><br>
            <span style="color:var(--fg-muted);font-size:12.5px">${esc(u.job)}</span></span>

  return `<div class="module enter">

        <p class="note" style="margin-bottom:var(--space-3)"><b>Agents</b> do the day’s tasks and file every run with its inputs, outputs and cost. <b>Supervisors</b> sweep those runs on a cadence, resolve conflicts, and write the decision record. <b>Chiefs</b> hold the charter for a domain. The <b>CEO</b> reads seven briefs, not the ${nf.format(Object.values(DB.throughput).reduce((t,s) => t + s.at(-1), 0))} runs a day behind them.</p>

            <h2 class="sec">${esc(DB.org.principal.name)}</h2><span class="label">${esc(DB.org.principal.role)}</span>

<script>
/* ---------- Revenue ---------- */
function revenue(){
  const active = DB.retainers.filter(r => r.status === "active");
  const churned = DB.retainers.filter(r => r.status === "churned");
  const mrr = sum(active, r => r.mrr), cost = sum(active, r => r.cost);
  const outstanding = DB.invoices.filter(i => i.status === "issued" || i.status === "late");
  const today = new Date("2026-09-01T12:00:00");
  const daysOver = d => Math.round((today - new Date(d + "T12:00:00")) / 86400000);
  const priced = q => sum(q.lines, l => l.qty * l.price);
  const monthly = q => sum(q.lines.filter(l => (DB.price_book.find(p => p.code === l.code) || {}).billing === "monthly"), l => l.qty * l.price);
  const openQuotes = DB.quotes.filter(q => q.status === "sent" || q.status === "in review");
  const below = DB.quotes.flatMap(q => q.lines
    .map(l => ({q, l, pb:DB.price_book.find(p => p.code === l.code)}))
    .filter(x => x.pb && x.l.price < x.pb.floor));
  const mrrRows = active.map(r => ({label:r.account.replace(/ (Group|Restoration|Aesthetics)$/, ""), value:r.mrr,
    sub:pf((r.mrr - r.cost) / r.mrr) + " gross margin"}));

  return `<div class="module enter">
    <div class="cols-3">
      ${stat(cf.format(mrr), "MRR", nf.format(active.length) + " active retainers")}
      ${stat(cf.format(mrr * 12), "ARR", "at today’s book")}
      ${stat(pf((mrr - cost) / mrr, 1), "Gross margin", cf.format(mrr - cost) + "/mo after cost to serve")}
      ${stat(cf.format(sum(outstanding, i => i.amount)), "Outstanding", nf.format(outstanding.length) + " invoices")}
      ${stat(cf.format(sum(openQuotes, monthly)), "MRR quoted, undecided", nf.format(openQuotes.length) + " quotes out")}
      ${stat(nf.format(churned.length), "Churned", churned.length ? "reason on the row" : "none")}
    </div>

    <div class="split">
      ${panel("MRR by client", barChart(mrrRows, {fmt:cf.format, aria:"Monthly recurring revenue by client"}) +
        `<p class="label" style="margin-top:var(--space-2)">Hover a bar for gross margin</p>`)}
      ${panel("Receivables", outstanding.length ? `<div class="stack">${outstanding.map(i => {
          const over = daysOver(i.due_on);
          return `<div class="unit"><span class="nm"><b>${esc(i.account)}</b> — ${cf.format(i.amount)}
            <br><span class="label" translate="no">${esc(i.ref)} · due ${esc(fmtDate(i.due_on))}</span></span>
            ${pill(over > 0 ? "crit" : "info", over > 0 ? over + " days late" : "due in " + Math.abs(over) + " days")}</div>`;
        }).join("")}</div>
        <p class="note" style="margin-top:var(--space-3)">Collections is a capability we sell, so we run it on ourselves. Anything past due goes to the payment agent on the same schedule a client’s would.</p>`
        : `<div class="empty"><b>Nothing outstanding.</b><p>Every issued invoice has cleared.</p></div>`)}
    </div>

    ${panelFlush("Retainers", `<div class="tablewrap"><table class="grid">
      <caption class="sr">Active and ended retainers</caption>
      <thead><tr><th scope="col">Client</th><th scope="col">MRR</th><th scope="col">Cost to serve</th>
        <th scope="col">Gross profit</th><th scope="col">Margin</th><th scope="col">Started</th>
        <th scope="col">Term</th><th scope="col">State</th></tr></thead>
      <tbody>${DB.retainers.map(r => `<tr>
        <td><b>${esc(r.account)}</b>${r.churn_reason ? `<br><span class="label">${esc(r.churn_reason)}</span>` : ""}</td>
        <td class="num">${r.mrr ? cf.format(r.mrr) : "—"}</td><td class="num">${r.cost ? cf.format(r.cost) : "—"}</td>
        <td class="num">${r.mrr ? cf.format(r.mrr - r.cost) : "—"}</td>
        <td class="num">${r.mrr ? pf((r.mrr - r.cost) / r.mrr) : "—"}</td>
        <td class="num">${esc(fmtDate(r.started_on))}</td><td class="num">${nf.format(r.term_months)} mo</td>
        <td>${pill(r.status === "active" ? "good" : r.status === "churned" ? "crit" : "idle", r.status)}</td></tr>`).join("")}
      </tbody></table></div>`)}

    ${panelFlush("Quotes", `<div class="tablewrap"><table class="grid">
      <caption class="sr">Quotes and their state</caption>
      <thead><tr><th scope="col">Quote</th><th scope="col">Client</th><th scope="col">Contract value</th>
        <th scope="col">MRR</th><th scope="col">Term</th><th scope="col">Sent</th><th scope="col">State</th></tr></thead>
      <tbody>${DB.quotes.map(q => `<tr>
        <td class="mono" translate="no">${esc(q.ref)}</td><td>${esc(q.account)}<br><span class="label">${esc(q.notes)}</span></td>
        <td class="num">${cf.format(priced(q))}</td><td class="num">${cf.format(monthly(q))}</td>
        <td class="num">${nf.format(q.term_months)} mo</td>
        <td class="num">${q.sent_on ? esc(fmtDate(q.sent_on)) : "—"}</td>
        <td>${pill(q.status === "accepted" ? "good" : q.status === "declined" ? "crit" : q.status === "sent" ? "info" : "warn", q.status)}</td>
      </tr>`).join("")}</tbody></table></div>`)}

    <div class="split">
      ${panelFlush("Price book", `<div class="tablewrap"><table class="grid">
        <caption class="sr">Price book with margin floors</caption>
        <thead><tr><th scope="col">Line</th><th scope="col">Billing</th><th scope="col">List</th>
          <th scope="col">Floor</th><th scope="col">Cost</th></tr></thead>
        <tbody>${DB.price_book.map(p => `<tr>
          <td><b>${esc(p.name)}</b><br><span class="label" translate="no">${esc(p.code)}</span></td>
          <td>${esc(p.billing)}</td><td class="num">${cf.format(p.list)}</td>
          <td class="num">${cf.format(p.floor)}</td><td class="num">${cf.format(p.cost)}</td></tr>`).join("")}
        </tbody></table></div>`, `<span class="label">The floor is the sign-off line</span>`)}
      ${panel("Margin exceptions", below.length ? `<div class="stack">${below.map(x => `
          <div class="unit"><span class="nm"><b translate="no">${esc(x.q.ref)}</b> — ${esc(x.pb.name)}<br>
            <span class="label">Sold at ${cf.format(x.l.price)} against a ${cf.format(x.pb.floor)} floor · ${esc(x.q.account)}</span></span>
          ${pill(x.q.ceo_override ? "warn" : "crit", x.q.ceo_override ? "CEO signed" : "unauthorized")}</div>`).join("")}
        <p class="note" style="margin-top:var(--space-3)">Every line sold below its floor, and whether a human signed it off. The one on the books was discounted and lost anyway — the discount bought nothing, which is the argument for holding the floor.</p>`
        : `<div class="empty"><b>Nothing sold below floor.</b><p>Every quoted line cleared its margin guardrail without an override.</p></div>`)}
    </div>
  </div>`;
}

/* ---------- Payments ---------- */
const LADDER = [
  {step:1, when:"Due − 3",  channel:"Email",       owner:"agent"},
  {step:2, when:"Due + 1",  channel:"Email",       owner:"agent"},
  {step:3, when:"Due + 7",  channel:"Email + SMS", owner:"agent"},
  {step:4, when:"Due + 14", channel:"Phone",       owner:"agent"},
  {step:5, when:"Due + 21", channel:"Phone",       owner:"human"},
  {step:6, when:"Due + 30", channel:"Decision",    owner:"CEO"}
];
function payments(){
  const today = new Date("2026-09-01T12:00:00");
  const daysOver = d => Math.round((today - new Date(d + "T12:00:00")) / 86400000);
  const billed = sum(DB.invoices, i => i.amount);
  const collected = sum(DB.invoices.filter(i => i.status === "paid"), i => i.amount);
  const overdue = DB.invoices.filter(i => i.status === "late");
  const outstanding = DB.invoices.filter(i => i.status === "issued" || i.status === "late");
  const conn = DB.payment_accounts;
  const live = conn.filter(c => c.status === "connected");
  const queue = outstanding.map(i => {
    const steps = DB.dunning_attempts.filter(d => d.invoice === i.ref);
    const last = steps.length ? Math.max(...steps.map(d => d.step)) : 0;
    return {inv:i, last, next:last + 1, over:daysOver(i.due_on), steps};
  }).sort((a,b) => b.over - a.over);

  const connRow = c => {
    const [cl, t] = c.status === "connected" ? ["good","connected"]
      : c.status === "revoked" ? ["crit","revoked"] : ["warn","pending"];
    return `<div class="keyrow">
      <span class="kn"><b>${esc(c.account || "Hero Capital")}</b>

      <span class="meterwrap"><span class="label">${c.owner === "hero" ? "We are merchant" : "Client is merchant"}</span>
        <span class="meterval${c.settles_to_hero ? "" : ""}">${c.settles_to_hero ? "settles to Hero" : "settles to them"}</span></span>
      ${pill(cl, t)}</div>`;
  };

  return `<div class="module enter">
    <div class="cols-3">
      ${stat(cf.format(collected), "Collected", pf(collected / billed, 1) + " of " + cf.format(billed) + " billed")}
      ${stat(cf.format(sum(outstanding, i => i.amount)), "Outstanding", nf.format(outstanding.length) + " invoices")}
      ${stat(cf.format(sum(overdue, i => i.amount)), "Overdue", overdue.length ? nf.format(daysOver(overdue[0].due_on)) + " days on the oldest" : "none")}
      ${stat(nf.format(live.length) + " of " + nf.format(conn.length), "Connections live")}
    </div>

    <div class="split">
      ${panel("Collections queue", queue.length ? `<div class="stack">${queue.map(q => {
        const human = q.next >= 5;
        return `<div class="unit"><span class="nm"><b>${esc(q.inv.account)}</b> — ${cf.format(q.inv.amount)}
          <br><span class="label" translate="no">${esc(q.inv.ref)} · due ${esc(fmtDate(q.inv.due_on))} · ${q.over > 0 ? nf.format(q.over) + " days late" : "not yet due"}</span>
          ${q.steps.length ? `<br><span class="label">Last: step ${q.steps.at(-1).step}, ${esc(q.steps.at(-1).outcome)} — ${esc(q.steps.at(-1).note)}</span>` : ""}</span>
          ${pill(human ? "crit" : q.over > 0 ? "warn" : "info", human ? "step " + q.next + " · human" : "step " + q.next + " · agent")}</div>`;
      }).join("")}</div>
      <p class="note" style="margin-top:var(--space-3)">A human takes over at step 5 because the conversation stops being about an invoice and starts being about the relationship. The ladder stops the moment a payment posts, and pauses on a promise.</p>`
      : `<div class="empty"><b>Nothing to chase.</b><p>Every issued invoice has cleared.</p></div>`)}

      ${panel("The ladder", `<div class="tablewrap"><table class="grid">
        <caption class="sr">Dunning ladder</caption>
        <thead><tr><th scope="col">Step</th><th scope="col">When</th><th scope="col">Channel</th><th scope="col">Who</th></tr></thead>
        <tbody>${LADDER.map(l => `<tr>
          <td class="num">${l.step}</td><td class="mono">${esc(l.when)}</td><td>${esc(l.channel)}</td>
          <td>${l.owner === "agent" ? `<span class="label">agent</span>` : pill(l.owner === "CEO" ? "crit" : "warn", l.owner)}</td>
        </tr>`).join("")}</tbody></table></div>
        <p class="note" style="margin-top:var(--space-3)">Chasing money is a capability we sell, so we run it on ourselves the same way. Escalation is by schedule, not by mood.</p>`)}
    </div>

    ${panel("Connections", conn.map(connRow).join(""),
      `<span class="label">Two flows, one rule</span>`)}

    <div class="split">
      ${panel("Whose money moves", `
        <p class="note" style="margin-bottom:var(--space-3)"><b>Flow A — Hero gets paid.</b> Retainers, setup, overage. Hero is merchant of record and the money lands in our account. Ordinary billing.</p>
        <p class="note" style="margin-bottom:var(--space-3)"><b>Flow B — the client gets paid.</b> The payment capability we sell takes deposits and chases balances from <i>their</i> customers. The client is merchant of record, funds settle to them, and we hold a delegated key we can be stripped of in one click.</p>
        <p class="note"><b>Hero never touches Flow B money.</b> Receiving, holding or routing a customer’s payment is money transmission — licensing, KYC, chargeback liability. For a firm of one human and twenty-one agents that is not a cost problem, it is an existential one. The rule is a database constraint, not a paragraph: a client-owned account cannot be marked as settling to Hero.</p>`)}
      ${panel("How it does not double-charge", `
        <p class="note" style="margin-bottom:var(--space-3)">Webhooks arrive twice. Agents retry after timeouts. The defence is a ledger, not care: every event is stored with a unique provider event id, so a replay hits the constraint and stops. Every write sends an idempotency key derived from our own row id.</p>
        <p class="note" style="margin-bottom:var(--space-3)">Payments reconcile to invoices by provider object id, never by amount and date — two invoices for the same client in the same month at the same price is normal.</p>
        <p class="note">No card number ever reaches our servers, our logs, or an agent’s context. Hosted links only. An agent offered a card over the phone does not write it down; it sends the link.</p>`)}
    </div>

    <p class="note"><b>Not connected yet.</b> The schema, constraints, queue and surface are built; no provider key exists. What remains is the webhook endpoint, the Connect OAuth callback, and the nightly reconciliation sweep — the tables are already the shape those three need. See <span class="mono" translate="no">docs/PAYMENTS.md</span>.</p>
  </div>`;
}

function dataRows(){
  const t = TABLES[ui.table]; let rows = t.rows().slice();
  if (ui.q){ const q = ui.q.toLowerCase();
    rows = rows.filter(r => Object.values(r).some(v => String(v).toLowerCase().includes(q))); }
  if (ui.sort.col){ const c = ui.sort.col, dir = ui.sort.dir;
    rows.sort((a,b) => { const x = a[c], y = b[c];
      return (typeof x === "number" && typeof y === "number") ? (x-y)*dir : String(x).localeCompare(String(y))*dir; }); }
  return rows;
}
function toCSV(rows){
  if (!rows.length) return "";
  const cols = [...new Set(rows.flatMap(Object.keys))];
  const cell = v => { const s = Array.isArray(v) ? v.join(" ") : String(v ?? "");
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  return [cols.join(","), ...rows.map(r => cols.map(c => cell(r[c])).join(","))].join("\n");
}
function dataModule(){
  const t = TABLES[ui.table], rows = dataRows();
  const cols = rows.length ? [...new Set(rows.flatMap(Object.keys))] : [];
  const dump = ui.fmt === "csv" ? toCSV(rows) : JSON.stringify(rows, null, 2);
  const head = cols.map(c => {
    const on = ui.sort.col === c, dir = ui.sort.dir > 0 ? "ascending" : "descending";
    return `<th scope="col"${on ? ` aria-sort="${dir}"` : ""}>
      <button class="sortbtn" type="button" data-col="${esc(c)}" aria-label="Sort by ${esc(c)}${on ? ", currently " + dir : ""}">
        ${esc(c)}${on ? `<span class="sortmark" aria-hidden="true">${ui.sort.dir > 0 ? "▲" : "▼"}</span>` : ""}
      </button></th>`;
  }).join("");
  const body = rows.map(r => `<tr>${cols.map(c => {
    const v = r[c], isNum = typeof v === "number";
    return `<td class="${isNum ? "num" : ""}">${esc(isNum && c.includes("value") ? cf.format(v) : Array.isArray(v) ? v.join(", ") : v)}</td>`;
  }).join("")}</tr>`).join("");

  return `<div class="module enter">
    <div class="row" style="gap:var(--space-3)">
      <label class="sr" for="tableSel">Table</label>
      <select class="field" id="tableSel">${Object.keys(TABLES).map(k =>
        `<option value="${k}"${k === ui.table ? " selected" : ""}>${k} (${TABLES[k].rows().length})</option>`).join("")}</select>
      <label class="sr" for="qBox">Filter rows</label>
      <input class="field" id="qBox" type="search" placeholder="Filter rows…" value="${esc(ui.q)}"
        autocomplete="off" spellcheck="false">
      <span class="label">${esc(t.note)}</span>
    </div>
    ${rows.length ? `${panelFlush(ui.table, `<div class="tablewrap" style="max-height:56vh;overflow:auto">
        <table class="grid dense"><caption class="sr">${esc(ui.table)}</caption>
        <thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`,
        `<span class="label">${nf.format(rows.length)} of ${nf.format(t.rows().length)} rows · key ${esc(t.pk)}</span>`)}`
      : `<div class="empty"><b>Nothing matches “${esc(ui.q)}” in ${esc(ui.table)}.</b>
          <p>The filter reads every column, so try a shorter fragment — an industry, an agent id like <span class="mono" translate="no">AG-SALES</span>, or a city. Other tables are not searched.</p>
          <button class="btn" type="button" id="clearQ">Clear Filter</button></div>`}
    ${panel("Export", `
      <div class="row" style="margin-bottom:var(--space-2)">
        <span class="label">${nf.format(rows.length)} rows selected</span>
        <button class="btn" type="button" data-fmt="csv"${ui.fmt === "csv" ? ' style="border-color:var(--accent);color:var(--fg-primary)"' : ""} aria-pressed="${ui.fmt === "csv"}">CSV</button>
        <button class="btn" type="button" data-fmt="json"${ui.fmt === "json" ? ' style="border-color:var(--accent);color:var(--fg-primary)"' : ""} aria-pressed="${ui.fmt === "json"}">JSON</button>
        <button class="btn" type="button" id="copyBtn">Copy To Clipboard</button>
      </div>
      <pre class="dump" id="dump" tabindex="0">${esc(dump) || "— no rows in the current selection —"}</pre>
      <p class="note" style="margin-top:var(--space-2)">For a file on disk, the same selection runs from the repository:
        <span class="mono" translate="no">python scripts/extract.py --table ${esc(ui.table)} --format ${esc(ui.fmt)} --out exports/</span> — same columns, same order, straight out of Postgres.</p>`)}
  </div>`;
}

function integrations(){
  const local = DB.api_keys.filter(k => k.host === "local cloud");
  const metered = DB.api_keys.filter(k => k.host === "cloud");
  const manual = DB.api_keys.filter(k => k.host === "web");

    if (!k.limit) return `<span class="label">Local · unmetered</span>`;
    const f = Math.min(k.used / k.limit, 1), cls = f >= .95 ? "out" : f >= .8 ? "low" : "";
    const read = `${nf.format(k.used)} / ${nf.format(k.limit)} ${k.unit}`;
    return `<span class="meterwrap">
      <span class="meter" role="img" aria-label="${esc(k.service)}: ${esc(read)} used"><i class="${cls}" style="width:${(f*100).toFixed(0)}%"></i></span>
      <span class="meterval${f >= .8 ? " hot" : ""}">${esc(read)}</span></span>`;
  };
  const row = k => { const [cl,t] = statusPill(k.status); return `<div class="keyrow">
    <span class="kn"><b>${esc(k.service)}</b><code translate="no">${esc(k.env)}</code>

  </div>`;
}

function svg(name){
  return `<svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor"
    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]}</svg>`;
}
function drawNav(){
  for (const [sel, group] of [["#navWork","Operations"], ["#navSystem","System"]]){
    const el = $(sel);
    el.querySelectorAll(".navitem").forEach(n => n.remove());
    el.insertAdjacentHTML("beforeend", MODULES.filter(m => m.group === group).map(m => {
      const c = m.count();
      return `<a class="navitem" href="#/${m.id}"${m.id === current ? ' aria-current="page"' : ""}>
        <span class="glyph">${svg(m.icon)}</span><span>${esc(m.name)}</span>
        <span class="count">${c === null ? "" : nf.format(c)}</span></a>`;
    }).join(""));
  }
}
</script>
<script>
/* ---------- routing: the URL is the state ---------- */
function readURL(){
  const raw = location.hash.replace(/^#\/?/, "");
  const [path, query] = raw.split("?");
  const id = byId(path || "overview").id;
  const p = new URLSearchParams(query || "");
  if (id === "data"){
    if (p.get("table") && TABLES[p.get("table")]) ui.table = p.get("table");
    ui.q = p.get("q") || "";
    const sc = p.get("sort");
    ui.sort = sc ? {col:sc.replace(/^-/, ""), dir:sc.startsWith("-") ? -1 : 1} : {col:null, dir:1};
    if (p.get("fmt") === "json" || p.get("fmt") === "csv") ui.fmt = p.get("fmt");
  }
  return id;
}
function writeURL(replace){
  let hash = "#/" + current;
  if (current === "data"){
    const p = new URLSearchParams();
    p.set("table", ui.table);
    if (ui.q) p.set("q", ui.q);
    if (ui.sort.col) p.set("sort", (ui.sort.dir < 0 ? "-" : "") + ui.sort.col);
    if (ui.fmt !== "csv") p.set("fmt", ui.fmt);
    hash += "?" + p.toString();
  }
  if (location.hash === hash) return;
  if (replace) history.replaceState(null, "", hash); else history.pushState(null, "", hash);
}
function paint(announce){
  const m = byId(current);
  $("#main").innerHTML = m.render();
  $("#moduleTitle").textContent = m.name;
  $("#scope").textContent = m.group;
  document.title = m.name + " · Hero Capital OS";
  drawNav();
  if (announce) $("#routeAnnounce").textContent = m.name + " module loaded";
}
function go(id, opts={}){
  current = byId(id).id;
  writeURL(opts.replace);
  paint(true);
  if (!opts.keepScroll) window.scrollTo({top:0, behavior:"instant"});
  if (opts.focus) $("#main").focus();
}
/* an in-module state change repaints without a history entry */
function refresh(){ writeURL(true); paint(false); }

addEventListener("hashchange", () => { current = readURL(); paint(true); });

/* ---------- delegated interaction ---------- */
$("#main").addEventListener("click", e => {
  const deal = e.target.closest("[data-deal]");
  if (deal){ ui.deal = deal.dataset.deal; refresh(); return; }

  const chief = e.target.closest("[data-chief]");
  if (chief){ const i = +chief.dataset.chief; ui.chief = ui.chief === i ? null : i; refresh(); return; }

  const col = e.target.closest("button[data-col]");
  if (col){ const c = col.dataset.col;
    ui.sort = ui.sort.col === c ? {col:c, dir:-ui.sort.dir} : {col:c, dir:1}; refresh(); return; }

  const fmt = e.target.closest("[data-fmt]");
  if (fmt){ ui.fmt = fmt.dataset.fmt; refresh(); return; }

  if (e.target.closest("#clearQ")){ ui.q = ""; refresh(); $("#qBox")?.focus(); return; }

  const copy = e.target.closest("#copyBtn");
  if (copy){
    navigator.clipboard.writeText($("#dump").textContent).then(
      () => { copy.textContent = "Copied"; setTimeout(() => { copy.textContent = "Copy To Clipboard"; }, 1600); },
      () => { const r = document.createRange(); r.selectNodeContents($("#dump"));
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
        copy.textContent = "Selected — press ⌘C"; setTimeout(() => { copy.textContent = "Copy To Clipboard"; }, 2600); }
    );
  }
});
$("#main").addEventListener("change", e => {
  if (e.target.id === "tableSel"){
    ui.table = e.target.value; ui.sort = {col:null, dir:1}; ui.q = "";
    refresh(); $("#tableSel")?.focus();
  }
});
$("#main").addEventListener("input", e => {
  if (e.target.id === "qBox"){
    ui.q = e.target.value; refresh();
    const box = $("#qBox");
    if (box){ box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
  }
});

/* ---------- command palette ---------- */
const scrim = $("#scrim"), pInput = $("#paletteInput"), pList = $("#paletteList");
let pIndex = 0, lastFocus = null;
function paletteMatches(){
  const q = pInput.value.trim().toLowerCase();
  return MODULES.filter(m => !q || m.name.toLowerCase().includes(q) || m.group.toLowerCase().includes(q));
}
function drawPalette(){
  const items = paletteMatches();
  pIndex = Math.min(pIndex, Math.max(items.length - 1, 0));
  pList.innerHTML = items.length ? items.map((m,i) => `
    <li><button type="button" data-go="${m.id}" data-active="${i === pIndex}">
      <span>${esc(m.name)}</span><span class="where">${esc(m.group)}</span></button></li>`).join("")
    : `<li><button type="button" disabled style="cursor:default;color:var(--fg-muted)">No module matches that name</button></li>`;
}
function openPalette(){
  lastFocus = document.activeElement;
  scrim.hidden = false; pInput.value = ""; pIndex = 0; drawPalette(); pInput.focus();
}
function closePalette(){ scrim.hidden = true; lastFocus?.focus(); }
$("#paletteBtn").addEventListener("click", openPalette);
pInput.addEventListener("input", () => { pIndex = 0; drawPalette(); });
pList.addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if (!b) return;
  closePalette(); go(b.dataset.go, {focus:true});
});
scrim.addEventListener("mousedown", e => { if (e.target === scrim) closePalette(); });
pInput.addEventListener("keydown", e => {
  const items = paletteMatches();
  if (e.key === "ArrowDown"){ e.preventDefault(); pIndex = (pIndex + 1) % items.length; drawPalette(); }
  else if (e.key === "ArrowUp"){ e.preventDefault(); pIndex = (pIndex - 1 + items.length) % items.length; drawPalette(); }
  else if (e.key === "Enter" && items[pIndex]){ e.preventDefault(); closePalette(); go(items[pIndex].id, {focus:true}); }
  else if (e.key === "Escape"){ e.preventDefault(); closePalette(); }
});
addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); scrim.hidden ? openPalette() : closePalette(); return; }
  if (e.key === "Escape" && !scrim.hidden){ closePalette(); return; }
  if (e.target.matches("input, select, textarea") || !scrim.hidden) return;
  if (e.key === "[" || e.key === "]"){
    const i = MODULES.findIndex(m => m.id === current);
    go(MODULES[(i + (e.key === "]" ? 1 : MODULES.length - 1)) % MODULES.length].id);
  }
});

/* ---------- theme ---------- */
const themeBtn = $("#themeBtn");
const isDark = () => document.documentElement.getAttribute("data-theme") === "dark" ||
  (!document.documentElement.hasAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
function applyTheme(t){
  if (t) document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  themeBtn.textContent = isDark() ? "Light Mode" : "Dark Mode";
}
themeBtn.addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("hero-os-theme", next); } catch {}
});
try { applyTheme(localStorage.getItem("hero-os-theme")); } catch { applyTheme(null); }

/* ---------- boot ---------- */
current = readURL();
writeURL(true);
paint(false);
</script>
